<!DOCTYPE html>
<html>
<head>
  <title>SYMPOSIUM AI ALIGNMENT Options</title>
  <link rel="stylesheet" type="text/css" href="options.css">
</head>
<body>
  <h1>SYMPOSIUM</h1>
  <form id="api-key-form">
    <label for="gemini-key">Google Gemini API Key:</label>
    <input type="password" id="gemini-key" name="gemini-key">
    <br>
    <label for="openai-key">OpenAI API Key:</label>
    <input type="password" id="openai-key" name="openai-key">
    <br>
    <label for="anthropic-key">Anthropic API Key:</label>
    <input type="password" id="anthropic-key" name="anthropic-key">
    <br>
    <button type="submit">Save Keys</button>
  </form>
  <hr>
  <h2>Actions</h2>
  <button id="prompt-library-button">Prompt Library</button>
  <button id="insert-highlighted-button">Insert Highlighted</button>
  <button id="history-button">History</button>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Prompt Library</title>
  <link rel="stylesheet" type="text/css" href="prompt-library.css">
</head>
<body>
  <h1>Prompt Library</h1>
  <ul id="prompt-list">
    <li data-prompt="Summarize the key arguments of this article.">Summarize Key Arguments</li>
    <li data-prompt="Identify potential biases in this text.">Identify Potential Biases</li>
    <li data-prompt="Explain this topic in simpler terms.">Explain in Simpler Terms</li>
    <li data-prompt="What are the ethical implications of this technology?">Analyze Ethical Implications</li>
    <li data-prompt="Check this text for manipulative language.">Check for Manipulative Language</li>
  </ul>
  <script src="prompt-library.js"></script>
</body>
</html>
